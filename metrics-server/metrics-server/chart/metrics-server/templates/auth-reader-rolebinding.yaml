apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: {{ .Values.metrics_server.name }}
  name: {{ .Values.metrics_server.name }}-auth-reader
  namespace: {{ .Values.env.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
- kind: ServiceAccount
  name: {{ .Values.metrics_server.name }}
  namespace: {{ .Values.env.namespace }}

