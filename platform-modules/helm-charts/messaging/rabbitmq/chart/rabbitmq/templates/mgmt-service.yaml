apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.rabbitmq.name }}
  name: {{ .Values.rabbitmq.name }}-mgmt
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  {{- range $key, $value := .Values.rabbitmq.ports }}
    {{- if eq $key "management" }}
  - name: {{ $key }}
    port: {{ $value }}
    targetPort: {{ $value }}
    {{- end }}
  {{- end }}
  selector:
    app: {{ .Values.rabbitmq.name }}

