{{- if .Values.grafana.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
     kubernetes.io/ingress.class: nginx
  labels:
    app.kubernetes.io/name: {{ .Values.grafana.name }}
  name: {{ .Values.grafana.name }}
  namespace: {{ .Release.Namespace }}
spec:
  rules:
  - host: {{ .Values.grafana.ingress.host }}
    http:
      paths:
      - backend:
          service:
            name: {{ .Values.grafana.name }}
            port:
              number: {{ .Values.grafana.ports.grafana.port }}
        path: /{{ .Values.grafana.ingress.uri_path }}
        pathType: Prefix
{{- end }}
