apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: {{ .Values.grafana.name }}
  name: {{ .Values.grafana.name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  admin-user: {{ .Values.grafana.admin_user | b64enc | quote }}
  admin-password: {{ .Values.grafana.admin_password | b64enc | quote }}
  ldap-toml: ""
