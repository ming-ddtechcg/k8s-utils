#
# grafana
# 
service:
  nodeAffinity:
    #
    # node label
    # Note:
    # 1. if key is set, the service runs within node(s) is/are labeled with value "enabled"
    # 2. if key is not set (empty), the service runs within all nodes except control-plane/master node(s)
    #
    key:
    #
    # options for the node affinity
    # format:
    # enabled | disabled
    #
    value: enabled

grafana:
  name: grafana
  image: harbor.ddtechcg.com:5001/k8s-utils/grafana:13.0
  admin_user: admin
  admin_password: admin
  replicas: 1
  rolling_update:
    max_surge: 25%
    max_unavailable: 25%
  ports:
    grafana:
      port: "3000"
      protocol: TCP 
    service:
      port: "80"
      protocol: TCP 
  resources:
    limits:
      cpu: 500m
      memory: 1000Mi
    requests:
      cpu: 250m
      memory: 750Mi
  initworker:
    name: grafana-setup
    image: harbor.ddtechcg.com:5001/k8s-utils/python:3.12.15
  sidecar:
    name: grafana-sidecar
    image: harbor.ddtechcg.com:5001/k8s-utils/k8s-sidecar:0.1.151
  service:
    port: "80"
    type: ClusterIP
  data_storage:
    #  
    # to use the external storage
    #
    # format:
    # true | false
    #
    use_external: false
    name: grafana-data
    storageclass: nfs-client
    accessmodes: [ "ReadWriteMany" ]
    storage_size: 5Gi
  ingress:
    #  
    # to ingress facing, grafana is required to be configured the 
    # reverse proxy and sub path specify full url (with sub path) in
    # grafana.ini:
    # ;root_url = http://<host>/<uri_path>
    # ;serve_from_sub_path = false # if uri_path is empty
    # ;serve_from_sub_path = true  # if uri_path is not empty
    #
    # format:
    # true | false
    #
    enabled: false
    host: grafana-host
    uri_path:

datasource:
  #
  # to load the default datasources come with this repo.
  #
  # format:
  # true | false
  #
  enable_datasources: true

dashboard:
  #
  # to load the default dashboard providers come with this repo.
  #
  # format:
  # true | false
  #
  # Note:
  # 1. check the custom_dashboard option
  # 2. check providers.yaml and related infor for the custom dashboard loading
  #
  enable_dashboards: false
  custom_dashboard:
    #
    # to load the dashboards come with this repo.
    #
    # format:
    # true | false
    #
    load_dashboards: false
    directory_name: test

