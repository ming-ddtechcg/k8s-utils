[analytics]
check_for_updates = true
[auth.anonymous]
enabled = true
[grafana_net]
url = https://grafana.net
[grafana_com]
url = https://grafana.com
[log]
mode = console
[paths]
data = /var/lib/grafana/data
logs = /var/lib/grafana/log
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning
[server]
;serve_from_sub_path = true
;root_url = http://<ingress.host>/<ingress.uri_path>
enable_gzip = true
[users]
default_theme = system
[database]
type = sqlite3
path = /var/lib/grafana/db/grafana.db
cache_mode = shared
query_retries = 0
transaction_retries = 20

