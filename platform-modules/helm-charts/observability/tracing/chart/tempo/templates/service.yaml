apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.tempo.name }}
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port:   '{{ .Values.tempo.ports.port }}'
  labels:
    app.kubernetes.io/name: {{ .Values.tempo.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector: 
    app.kubernetes.io/name: {{ .Values.tempo.name }}
  type: ClusterIP  
  ports:
    - port: {{ .Values.tempo.ports.port }}
      targetPort: {{ .Values.tempo.ports.port }}

