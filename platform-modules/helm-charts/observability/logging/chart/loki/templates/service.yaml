apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.loki.name }}
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port:   '{{ .Values.loki.ports.port }}'
  labels:
    app.kubernetes.io/name: {{ .Values.loki.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector: 
    app.kubernetes.io/name: {{ .Values.loki.name }}
  type: ClusterIP  
  ports:
{{- range $key, $value := .Values.loki.ports }}
    - name: {{ $key }}
      port: {{ $value.port }}
      targetPort: {{ $value.port }}
      protocol: {{ $value.protocol }}
{{- end }}

