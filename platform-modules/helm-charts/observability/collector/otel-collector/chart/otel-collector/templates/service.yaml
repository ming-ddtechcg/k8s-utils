apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.otel_collector.name }}
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '{{ index .Values.otel_collector.ports "metrics" "port" }}'
    prometheus.io/path: '/metrics'
  labels:
    app.kubernetes.io/name: {{ .Values.otel_collector.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector: 
    app.kubernetes.io/name: {{ .Values.otel_collector.name }}
  type: ClusterIP  
  ports:
{{- range $key, $value := .Values.otel_collector.ports }}
    - name: {{ $key }}
      port: {{ $value.port }}
      targetPort: {{ $value.port }}
      protocol: {{ $value.protocol }}
{{- end }}

