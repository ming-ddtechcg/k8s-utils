apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.otel_collector.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.otel_collector.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.otel_collector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.otel_collector.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.otel_collector.name }}
      annotations:
        checksum/config-cm: {{ include (print $.Template.BasePath "/config-configmap.yaml") . | sha256sum }}
    spec:
{{- if .Values.service.nodeAffinity }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
{{- if .Values.service.nodeAffinity.key }}
{{- if eq .Values.service.nodeAffinity.value "enabled" }}
              - key: {{ .Values.service.nodeAffinity.key }}
                operator: In
                values:
                - {{ .Values.service.nodeAffinity.value }}
{{- else }}
              - key: no-node-label
                operator: In
                values:
                - DoesNotExist
{{- end }}
{{- else }}
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              - key: node-role.kubernetes.io/master
                operator: DoesNotExist 
{{- end }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ .Values.otel_collector.name }}
              topologyKey: kubernetes.io/hostname
{{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.otel_collector.name }}
      containers:
      - name: {{ .Values.otel_collector.name }}
        image: {{ .Values.otel_collector.image }}
        args:
          - --config=/etc/otel-collector/otel-collector-config.yaml
        ports:
{{- range $key, $value := .Values.otel_collector.ports }}
        - containerPort: {{ $value.port }}
          name: {{ $key }}
          protocol: {{ $value.protocol }}
{{- end }}
        resources:
          limits:
            cpu: {{ .Values.otel_collector.resources.limits.cpu }}
            memory: {{ .Values.otel_collector.resources.limits.memory }}
          requests:
            cpu: {{ .Values.otel_collector.resources.requests.cpu }}
            memory: {{ .Values.otel_collector.resources.requests.memory }}
        volumeMounts:
        - name: config-volume
          mountPath: /etc/otel-collector
          readOnly: true
      serviceAccount: {{ .Values.otel_collector.name }}
      serviceAccountName: {{ .Values.otel_collector.name }}
      volumes:
        - name: config-volume
          configMap:
            defaultMode: 420
            name: {{ .Values.otel_collector.name }}-config

