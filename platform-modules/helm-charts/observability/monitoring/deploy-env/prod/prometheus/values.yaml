#
# prometheus
# 
service:
  nodeAffinity:
    #
    # node label
    # Note:
    # 1. if key is set, the service runs within node(s) is/are labeled with value "enabled"
    # 2. if key is not set (empty), the service runs within all nodes except control-plane/master node(s)
    #
    key:
    #
    # options for the node affinity
    # format:
    # enabled | disabled
    #
    value: enabled

prometheus:
  name: prometheus
  image: harbor.ddtechcg.com:5001/k8s-utils/prometheus:v3.13.5
  resources:
    limits:
      cpu: 500m
      memory: 8000Mi
    requests:
      cpu: 100m
      memory: 1500Mi
  ports:
    metrics:
      port: "9090"
      protocol: TCP
  config:
    db_retention_time: 15d
    db_storage:
      #
      # to use the external storage
      #
      # format:
      # true | false
      #
      use_external: false
      db_name: prometheus-db
      storageclass: nfs-client
      accessmodes: [ "ReadWriteMany" ]
      storage_size: 5Gi
    #
    # Prefix for the internal routes of web endpoints. 
    #
    # Notes:
    # 1. defaults to path of --web.external-url.
    # 2. an empty for no setting.
    #
    web_route_prefix:
    #
    # The URL under which Prometheus is externally reachable (for example,
    # if Prometheus is served via a reverse proxy). Used for generating relative
    # and absolute links back to Prometheus itself. If the URL has a path portion,
    # it will be used to prefix all HTTP endpoints served by Prometheus. If omitted,
    # relevant URL components will be derived automatically
    # 
    # Notes:
    # 1. an empty for no setting.
    #
    web_external_url:
    ingress:
      #
      # ingress enable
      #
      # format:
      # true | false
      #
      enabled: false
      host:
      path: /
      path_type: Prefix

configmap_reload:
  name: prometheus-configmap-reload
  image: harbor.ddtechcg.com:5001/k8s-utils/configmap-reload:v0.9.0
  resources:
    limits:
      cpu: 100m
      memory: 500Mi
    requests:
      cpu: 20m
      memory: 150Mi

