apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: {{ .Values.prometheus.name }}
  name: {{ .Values.prometheus.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.prometheus.name }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.prometheus.name }}
  namespace: {{ .Release.Namespace }}

