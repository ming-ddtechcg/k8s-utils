apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: {{ .Values.service.component }}
    app.kubernetes.io/name: {{ .Values.exporter.name }}
    app.kubernetes.io/version: {{ .Values.service.version }}
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port:   '{{ .Values.exporter.ports.http_metrics_port }}'
  name: {{ .Values.exporter.name }}
  namespace: {{ .Values.service.namespace }}
spec:
  clusterIP: None
  ports:
  - name: {{ .Values.exporter.ports.http_metrics_port_name }}
    port: {{ .Values.exporter.ports.http_metrics_port }}
    targetPort: {{ .Values.exporter.ports.http_metrics_port }}
  - name: {{ .Values.exporter.ports.telemetry_port_name }}
    port: {{ .Values.exporter.ports.telemetry_port }}
    targetPort: {{ .Values.exporter.ports.telemetry_port }}
  selector:
    app.kubernetes.io/name: {{ .Values.exporter.name }}

