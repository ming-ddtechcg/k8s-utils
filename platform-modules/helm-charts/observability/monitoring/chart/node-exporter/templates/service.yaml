apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.exporter.name }}
  labels:
    app.kubernetes.io/component: {{ .Values.service.component }}
    app.kubernetes.io/name: {{ .Values.exporter.name }}
    app.kubernetes.io/version: {{ .Values.service.version }}
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port:   '{{ .Values.exporter.port }}'
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.exporter.name }}
  ports:
  - name: {{ .Values.exporter.port_name }}
    protocol: TCP
    port: {{ .Values.exporter.port }}
    targetPort: {{ .Values.exporter.port }}

