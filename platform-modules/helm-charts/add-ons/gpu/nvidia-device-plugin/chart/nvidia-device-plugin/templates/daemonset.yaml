apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: {{ .Values.nvidia_device_plugin.name }}
  name: {{ .Values.nvidia_device_plugin.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      name: {{ .Values.nvidia_device_plugin.name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: {{ .Values.nvidia_device_plugin.name }}
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
{{- if .Values.service.nodeAffinity }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
{{- if .Values.service.nodeAffinity.key }}
{{- if eq .Values.service.nodeAffinity.value "enabled" }}
              - key: {{ .Values.service.nodeAffinity.key }}
                operator: In
                values:
                - {{ .Values.service.nodeAffinity.value }}
{{- else }}
              - key: no-node-label
                operator: In
                values:
                - DoesNotExist
{{- end }}
{{- else }}
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              - key: node-role.kubernetes.io/master
                operator: DoesNotExist 
{{- end }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - {{ .Values.nvidia_device_plugin.name }}
              topologyKey: kubernetes.io/hostname
{{- end }}
      containers:
        - name: {{ .Values.nvidia_device_plugin.name }}
          image: {{ .Values.nvidia_device_plugin.image }}
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"     # don't crash-loop on nodes without GPUs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
