kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app.kubernetes.io/name: {{ .Values.dashboard.name }}
  name: {{ .Values.dashboard.name }}
  namespace: {{ .Release.Namespace }}
rules:
  # Allow Dashboard to get, update and delete Dashboard exclusive secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.dashboard.name }}-key-holder", "{{ .Values.dashboard.name }}-certs", "{{ .Values.dashboard.name }}-csrf"]
    verbs: ["get", "update", "delete"]
    # Allow Dashboard to get and update 'kubernetes-dashboard-settings' config map.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ .Values.dashboard.name }}-settings"]
    verbs: ["get", "update"]
    # Allow Dashboard to get metrics.
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["heapster", "{{ .Values.metrics_scraper.name }}"]
    verbs: ["proxy"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["heapster", "http:heapster:", "https:heapster:", "{{ .Values.metrics_scraper.name }}", "http:{{ .Values.metrics_scraper.name }}"]
    verbs: ["get"]

