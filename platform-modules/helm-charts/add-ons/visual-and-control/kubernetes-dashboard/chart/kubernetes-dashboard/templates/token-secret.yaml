apiVersion: v1
kind: Secret
metadata:
  annotations:
    secret-type: token
    kubernetes.io/service-account.name: {{ .Values.dashboard.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.dashboard.name }}
  name: {{ .Values.dashboard.name }}-token
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/service-account-token
data:
  token: ""

