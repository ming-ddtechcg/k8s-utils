kind: Deployment
apiVersion: apps/v1
metadata:
  labels:
    app.kubernetes.io/name: {{ .Values.dashboard.name }}
  name: {{ .Values.dashboard.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.dashboard.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.dashboard.name }}
    spec:
      containers:
        - name: {{ .Values.dashboard.name }}
          image: {{ .Values.dashboard.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.dashboard.service.ports.port }}
              protocol: {{ .Values.dashboard.ports.protocol }}
          args:
            - --auto-generate-certificates
            - --namespace={{ .Release.Namespace }}
            # Uncomment the following line to manually specify Kubernetes API server Host
            # If not specified, Dashboard will attempt to auto discover the API server and connect
            # to it. Uncomment only if the default does not work.
            # - --apiserver-host=http://my-address:port
          volumeMounts:
            - name: kubernetes-dashboard-certs
              mountPath: /certs
              # Create on-disk volume to store exec logs
            - mountPath: /tmp
              name: tmp-volume
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: {{ .Values.dashboard.ports.port }}
            initialDelaySeconds: 30
            timeoutSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1001
            runAsGroup: 2001
      volumes:
        - name: kubernetes-dashboard-certs
          secret:
            secretName: {{ .Values.dashboard.name }}-certs
        - name: tmp-volume
          emptyDir: {}
      serviceAccountName: {{ .Values.dashboard.name }}
      nodeSelector:
        "kubernetes.io/os": linux

