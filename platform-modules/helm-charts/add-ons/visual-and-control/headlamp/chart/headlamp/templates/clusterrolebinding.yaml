{{- if .Values.headlamp.config.cluster_admin }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: {{ .Values.headlamp.name }}
  name: {{ .Values.headlamp.name }}-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: {{ .Values.headlamp.name }}-admin
  namespace: {{ .Release.Namespace }}
{{- end }}

