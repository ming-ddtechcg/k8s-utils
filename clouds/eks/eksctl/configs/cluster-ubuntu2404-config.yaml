apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: test-cluster
  region: us-east-2
  version: "1.36"

nodeGroups:
  - name: test-cluster-nodes
    instanceType: t3.micro
    amiFamily: Ubuntu2404               # Operating system family
    minSize: 1
    desiredCapacity: 2
    maxSize: 3
    volumeSize: 40
    ssh:
      allow: true
      publicKeyName: ubuntu-eks
