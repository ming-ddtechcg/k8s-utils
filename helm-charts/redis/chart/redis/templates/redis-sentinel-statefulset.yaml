apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.redis_sentinel.name }}
  annotations:
    resource-type: redis-sentinel
    resource-name: {{ .Values.redis_sentinel.name }}
  labels:
    app: {{ .Values.redis_sentinel.name }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Values.redis_sentinel.name }}
  replicas: {{ .Values.redis_sentinel.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.redis_sentinel.name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        resource-type: redis-sentinel-pod
      labels:
        app: {{ .Values.redis_sentinel.name }}
        app-client: {{ .Values.redis_sentinel.name }}
    spec:
{{- if .Values.service.nodeAffinity }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
{{- if .Values.service.nodeAffinity.key }}
{{- if eq .Values.service.nodeAffinity.value "enabled" }}
              - key: {{ .Values.service.nodeAffinity.key }}
                operator: In
                values:
                - {{ .Values.service.nodeAffinity.value }}
{{- else }}
              - key: no-node-label
                operator: In
                values:
                - DoesNotExist
{{- end }}
{{- else }}
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              - key: node-role.kubernetes.io/master
                operator: DoesNotExist 
{{- end }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ .Values.redis_sentinel.name }}
              topologyKey: kubernetes.io/hostname
{{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.redis_sentinel.name }}
      containers:
      - command:
        - sh
        - -c
        - "mkdir -p /usr/local/sbin /usr/local/tmp; cp /usr/local/tmp-sbin/* /usr/local/sbin; cp /usr/local/tmp-utils-sbin/* /usr/local/sbin; chmod +x /usr/local/sbin/*.sh; /usr/local/sbin/sentinel-init.sh; /usr/local/sbin/sentinel.sh"
        env:
        - name: CHART_NAME
          value: {{ .Chart.Name }}
        - name: CHART_VERSION
          value: {{ .Chart.Version }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: RUNNING_NODENAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: RUNNING_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REDIS_SENTINEL_CONFIG
          value: {{ .Values.redis_sentinel.config.name }}
        name: {{ .Values.redis_sentinel.name }}
        image: {{ .Values.redis_sentinel.image }}
        imagePullPolicy: {{ .Values.redis_sentinel.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.redis_sentinel.containerport }}
        resources:
          limits:
            cpu: {{ .Values.redis_sentinel.resources.limits.cpu }}
            memory: {{ .Values.redis_sentinel.resources.limits.memory }}
          requests:
            cpu: {{ .Values.redis_sentinel.resources.requests.cpu }}
            memory: {{ .Values.redis_sentinel.resources.requests.memory }} 
        volumeMounts:
        - mountPath: /usr/local/tmp-sbin
          name: scripts
      serviceAccount: {{ .Values.service.name }}
      serviceAccountName: {{ .Values.service.name }}
      volumes:
      - name: scripts
        configMap:
          name: {{ .Values.redis_sentinel.name }}-scripts

