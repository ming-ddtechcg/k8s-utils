#
# RabbitMQ
#

service:
  nodeAffinity:
    #
    # node label
    # Note:
    # 1. if key is set, the service runs within node(s) is/are labeled with value "enabled"
    # 2. if key is not set (empty), the service runs within all nodes except control-plane/master node(s)
    #
    key:
    #
    # options for the node affinity
    # format:
    # enabled | disabled
    #
    value: enabled

rabbitmq:
  name: rabbitmq
  replicas: "3"
  container:
    image: harbor.ddtechcg.com/library/rabbitmq:3.13-management
  ports:
    discovery: "4369"
    amqp: "5672"
    management: "15672"
  resources:
    limits:
      cpu: 450m
      memory: 500Mi
    requests:
      cpu: 200m
      memory: 150Mi
  storage:
    storageclass: nfs-client-retain
    accessmodes:
    - ReadWriteOnce
    size: 50Mi
  config:
    #
    # RabbitMQ Erlang cookie
    #
    rabbitmq_erlang_cookie: WIWVHCDTCIUAWANLMQAW
    #
    # The Kubernetes domain name
    #
    cluster_domain: cluster.local
    #
    # show the console logs
    #
    # value: "true"|"false"
    #
    rabbitmq_console_log: "true"

rabbitmq_init:
  name: rabbitmq-init
  container:
    image: harbor.ddtechcg.com/library/busybox:1.38.0
  resources:
    limits:
      cpu: 50m
      memory: 100Mi

rabbitmq_mgmt:
  #
  # RabbitMQ management ingress
  #
  # value: enabled|disable
  # 
  ingress: enabled
  hostname: ariel-rabbitmq-mgmt.ddtechcg.com
  #
  # set URI
  #
  # NOTE:
  # 1. if uri is set, the URI rewrite will be enabled, otherwise leave empty
  #    for example:
  #    uri: rabbitmq-mgmt
  uri:

