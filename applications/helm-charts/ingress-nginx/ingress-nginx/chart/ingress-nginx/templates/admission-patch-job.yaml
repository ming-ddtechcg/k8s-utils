apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: {{ .Values.service.components.admission_webhook }}
    app.kubernetes.io/instance: {{ .Values.controller.name }}
    app.kubernetes.io/name: {{ .Values.controller.name }}
    app.kubernetes.io/part-of: {{ .Values.controller.name }}
    app.kubernetes.io/version: {{ .Values.service.version }}
  name: {{ .Values.admission_patch.name }}
  namespace: {{ .Values.service.namespace_definition.namespace }}
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Values.service.components.admission_webhook }}
        app.kubernetes.io/instance: {{ .Values.controller.name }}
        app.kubernetes.io/name: {{ .Values.controller.name }}
        app.kubernetes.io/part-of: {{ .Values.controller.name }}
        app.kubernetes.io/version: {{ .Values.service.version }}
      name: {{ .Values.admission_patch.name }}
    spec:
      containers:
      - args:
        - patch
        - --webhook-name={{ .Values.admission.name }}
        - --namespace=$(POD_NAMESPACE)
        - --patch-mutating=false
        - --secret-name={{ .Values.admission.name }}
        - --patch-failure-policy=Fail
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: {{ .Values.admission_patch.image }}
        imagePullPolicy: IfNotPresent
        name: {{ .Values.admission_patch.name }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.admission.name }}
