apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: {{ .Values.service.components.controller }}
    app.kubernetes.io/instance: {{ .Values.controller.name }}
    app.kubernetes.io/name: {{ .Values.controller.name }}
    app.kubernetes.io/part-of: {{ .Values.controller.name }}
    app.kubernetes.io/version: {{ .Values.service.version }}
  name: {{ .Values.controller.name }}
  namespace: {{ .Values.service.namespace_definition.namespace }}
spec:
  minReadySeconds: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Values.service.components.controller }}
      app.kubernetes.io/instance: {{ .Values.controller.name }}
      app.kubernetes.io/name: {{ .Values.controller.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Values.service.components.controller }}
        app.kubernetes.io/instance: {{ .Values.controller.name }}
        app.kubernetes.io/name: {{ .Values.controller.name }}
        app.kubernetes.io/part-of: {{ .Values.controller.name }}
        app.kubernetes.io/version: {{ .Values.service.version }}
    spec:
      hostNetwork: true
      containers:
      - args:
        - /nginx-ingress-controller
        - --election-id=ingress-nginx-leader
        - --controller-class=k8s.io/{{ .Values.controller.name }}
        - --ingress-class=nginx
        - --configmap=$(POD_NAMESPACE)/{{ .Values.controller.name }}
        - --validating-webhook=:{{ .Values.controller.ports.webhook_port }}
        - --validating-webhook-certificate=/usr/local/certificates/cert
        - --validating-webhook-key=/usr/local/certificates/key
        - --enable-metrics=false
        - --annotations-prefix=nginx.ingress.kubernetes.io
        - --publish-service=$(POD_NAMESPACE)/{{ .Values.controller.name }}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LD_PRELOAD
          value: /usr/local/lib/libmimalloc.so
        image: registry.k8s.io/ingress-nginx/controller:v1.11.2@sha256:d5f8217feeac4887cb1ed21f27c2674e58be06bd8f5184cacea2a69abaf78dce
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /wait-shutdown
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 10254
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: {{ .Values.controller.name }}
        ports:
        - containerPort: {{ .Values.controller.ports.http_port }}
          name: {{ .Values.controller.ports.http_port_name }}
          protocol: TCP
        - containerPort: {{ .Values.controller.ports.https_port }}
          name: {{ .Values.controller.ports.https_port_name }}
          protocol: TCP
        - containerPort: {{ .Values.controller.ports.webhook_port }}
          name: {{ .Values.controller.ports.webhook_port_name }}
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 10254
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          requests:
            cpu: {{ .Values.controller.resources.requests.cpu }}
            memory: {{ .Values.controller.resources.requests.memory }}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          runAsUser: 101
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /usr/local/certificates/
          name: webhook-cert
          readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccount: {{ .Values.controller.name }}
      serviceAccountName: {{ .Values.controller.name }}
      terminationGracePeriodSeconds: 300
      volumes:
      - name: webhook-cert
        secret:
          secretName: {{ .Values.admission.name }}
{{- if .Values.service.control_plane_deployment }}
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
{{- end }}

